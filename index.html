<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Solicitud de empleo</title>
    <script src="main.js">
    </script>
</head>
<body>
<img src="fondo.png" id="full-screen-background-image"/>
<div class="container">
<form name="registro">
<h1 align="center">Solicitud de empleo</h1>
    Nombre:
    <input type="text" width="300" name="nombre" id="nombre" class="field" required><br><br>

    <fieldset>
    <legend>Estado Civil</legend>
    <label>
        <input type="radio" name="estado" id="radio1" value="soltero"> Soltero(a)
    </label>
    <label>
        <input type="radio" name="estado" id="radio2" value="casado"> Casado(a)
    </label>
    <label>
        <input type="radio" name="estado" id="radio3" value="otro"> Otro
    </label>
    </fieldset>
<br>
    <fieldset>
    <legend>Habilidades Digitales</legend>
    <label>
        <input type="checkbox" id="check1" value="Programar en diversos lenguajes"> Programar en diversos lenguajes
    </label>
    <label>
        <input type="checkbox" id="check2" value="Git y GitHub"> Git y GitHub
    </label>
    <label>
        <input type="checkbox" id="check3" value="Bases de datos y SQL"> Bases de datos y SQL
    </label>
    <label>
        <input type="checkbox" id="check4" value="Linux"> Linux
    </label>
    </fieldset><br>
<label for="sucursal">Escoge la sucursal que te quede más cerca:</label><br><br>
<select name="sucursal" id="tienda" onchange="obtenerdatos()">
    <option id="op1" value="Escobedo" selected>Escobedo</option>
    <option id="op2" value="San Nicolás">San Nicolás</option>
    <option id="op3" value="Monterrey">Monterrey</option>
    <option id="op4" value="Apodaca">Apodaca</option>
</select><br><br>
<center>
<input type="button" name="btn1" value="Enviar" id="bt" onclick="obtenerdatos()">
</center>
<br><br>
<hr>
<label>
    <h2>Datos guardados</h2>
</label>
<table width="300">
<tr>
    <td>Nombre:</td>
    <td><input type="text" name="nombreobtenido" id="nombreobtenido" readonly></td>
</tr>
<tr>
    <td>Estado Civil:</td>
    <td><input type="text" name="estadocivil" id="estadocivil" readonly></td>
</tr>
<tr>
    <td>Tus habilidades son:</td>
    <td><input type="text" name="tushabilidades" id="tushabilidades" readonly></td>
</tr>
<tr>
    <td>Sucursal de preferencia:</td>
    <td><input type="text" name="tusucursal" id="tusucursal" readonly></td>
</tr>
</table>
<br>
<center>
    <a href="login.html" target="_blank" rel="noopener noreferrer">
        <button type="button">Inicia Sesión</button>
    </a>
</center>
</form>
</div>
<!-- Pie -->

</body>
</html>
